[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-meta-perf"
version = "0.1.0"
authors = [
    {name = "Mário Antunes", email = "mario.antunes@av.it.pt"}
]
description = "Interpretable additive equations that predict the performance of a model on a dataset from meta-features"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "polars>=1.20.0",
    "numpy>=2.0.0",
    # Reads `config/mcc.json` -- the one file holding every tuned hyperparameter -- into the
    # typed configuration dataclasses, and lets a command line override any field of it.
    "jsonargparse>=4.40.0",
    # Knee detection (Kneedle, multi-knee) for the equation-length rules in `selection` and `lengths`.
    "kneeliverse>=1.2.0",
]

[project.optional-dependencies]
# The development and CI tooling. The versions are pinned because an unpinned linter release
# that enables new rules by default fails a change that touched none of the code it flags;
# `.pre-commit-config.yaml` and `.github/workflows/main.yml` install exactly these.
dev = [
    "ruff==0.16.9",
    "basedpyright==1.40.1",
    "vulture==2.16",
    "pre-commit==4.6.2",
]
# The exact runtime of the reference reproduction (Python 3.12). The ranges in `dependencies`
# are what the package supports; these pins are what the reference results were produced with,
# including the transitive packages that can move a result.
reproducibility = [
    "jsonargparse==4.52.0",
    "kneeliverse==1.2.0",
    "numpy==2.5.3",
    "polars==1.44.2",
    "polars-runtime-32==1.44.2",
    "pyUTSAlgorithms==0.2.1",
    "PyYAML==6.0.3",
]
# Regenerating `dataset/meta_dataset.csv` from the raw datasets (`meta_dataset_pipeline/`).
# Consuming the corpus needs none of this.
meta-dataset = [
    "pandas>=2.2.0",
    "pymfe==0.4.4",
    "optuna",
    "pytorch-tabnet",
    "tab-transformer-pytorch==0.4.2",
    "rtdl_revisiting_models",
    "tabicl",
    "tabpfn",
    "torch",
    "keras",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "deap",
    "pyBlindOpt",
]

[project.scripts]
# One command with three subcommands: `fit`, `sweep` and `init`; `ml-meta-perf --help` documents them.
ml-meta-perf = "ml_meta_perf.cli:main"
# The configuration sweep as a command of its own (the same as `ml-meta-perf sweep`).
ml-meta-perf-search = "ml_meta_perf.sweep:main"

[project.urls]
Repository = "https://github.com/mariolpantunes/ml-meta-perf"
Issues = "https://github.com/mariolpantunes/ml-meta-perf/issues"

[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src/ml_meta_perf", "tests"]
# The source tree, so the type check reads the working copy without the package installed --
# which is how the pre-commit hook runs it.
extraPaths = ["src"]
# No `venvPath`/`venv` here. basedpyright exits 3 when the configured venv is absent, which
# is every CI runner, and without it the tool does not infer one from the interpreter that
# launched it. Both call sites pass `--pythonpath` instead, which says the same thing
# explicitly and says it correctly in each place.
reportImportCycles = "none"

[tool.vulture]
paths = ["src/ml_meta_perf", "tests"]
min_confidence = 80

[tool.coverage.run]
source = ["src/ml_meta_perf"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
