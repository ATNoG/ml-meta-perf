[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-meta-perf"
version = "0.1.0"
authors = [
    {name = "Mário Antunes", email = "mario.antunes@av.it.pt"}
]
description = "Interpretable linear meta-models that predict the MCC of a classifier from dataset and model meta-features"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "polars>=1.20.0",
    "numpy>=2.0.0",
    "matplotlib>=3.8.0",
    # The opaque-regressor comparison, and the strongest ranking and threshold baselines.
    # It brings scipy with it, which this project refused for a long time on size grounds --
    # `ml_meta_perf.stats` exists because four statistics were not worth the dependency, and
    # that reasoning still holds for those four. What changed the answer is that the
    # comparison the chapters lean on hardest ("a forest reaches R2 0.9 in-sample and
    # transfers at 0.067") was measured once during exploration and could not be reproduced
    # by anyone reading the study. An unreproducible headline is a worse cost than a large
    # wheel, so it is a base dependency rather than an extra: an extra would leave the same
    # numbers unreproducible for anyone who did not know to ask for it.
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
# Tooling for `ml-meta-perf-search`, which is how the published equation's features,
# length and configuration were chosen. Not needed to fit or evaluate the shipped
# equations -- `pip install ml-meta-perf` reproduces the whole study without it -- so it
# is an extra rather than a base dependency.
search = [
    # `equation_search_cli` parallelises the grid over it. Declared explicitly rather than
    # relied on transitively, so a change in someone else's dependency chain cannot break it.
    "joblib>=1.3.0",
]

# Space-filling initialisation for the beam (`ml_meta_perf.seeding`). An extra rather than a
# base dependency because the published beam does not seed: `beam.VANILLA` reaches none of
# this, and `seeding.empty_space` degrades to the classical maximin rule when ESS is absent,
# so a study run without it produces exactly the published equation.
diversity = [
    "EmptySpaceSearch>=0.2.1",
    "torann>=0.5.0",
]

[project.scripts]
# The pipeline entry point. `ml-meta-perf --help` documents every input; the study is
# the default with no arguments.
ml-meta-perf = "ml_meta_perf.cli:main"
# Searches the AI-proposed descriptor pool down to a MODEL_FEATURES recommendation.
# Separate from `ml-meta-perf` since it needs the `search` extra and reads the candidate
# CSV (`assets/meta_dataset_all_descriptors.csv`), not the shipped corpus.
ml-meta-perf-search = "ml_meta_perf.equation_search_cli:main"
# Crosses the beam policies of `ml_meta_perf.beam` with the configuration grid, then decides
# with a paired test. Needs the `search` extra for the same reason: it is a cluster job.
ml-meta-perf-beam = "ml_meta_perf.beam_search_cli:main"

[project.urls]
Repository = "https://github.com/mariolpantunes/ml-meta-perf"
Issues = "https://github.com/mariolpantunes/ml-meta-perf/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The corpus ships with the package: `pip install ml-meta-perf && ml-meta-perf` has no repository
# around it to find a top-level data/ directory in.
ml_meta_perf = ["meta_dataset.csv"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src/ml_meta_perf", "tests"]
# No `venvPath`/`venv` here. basedpyright exits 3 when the configured venv is absent, which
# is every CI runner, and without it the tool does not infer one from the interpreter that
# launched it. Both call sites pass `--pythonpath` instead, which says the same thing
# explicitly and says it correctly in each place.
reportImportCycles = "none"

[tool.vulture]
paths = ["src/ml_meta_perf", "tests"]
min_confidence = 80

[tool.coverage.run]
source = ["src/ml_meta_perf"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
