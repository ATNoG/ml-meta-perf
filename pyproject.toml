[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metafit"
version = "0.1.0"
authors = [
    {name = "Mário Antunes", email = "mario.antunes@av.it.pt"}
]
description = "Interpretable linear meta-models that predict the MCC of a classifier from dataset and model meta-features"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "polars>=1.20.0",
    "numpy>=2.0.0",
    "matplotlib>=3.8.0",
    "kneeliverse>=1.2.0",
]

[project.scripts]
# The pipeline entry point. `metafit --help` documents every input; the study is
# the default with no arguments.
metafit = "metafit.cli:main"

[project.urls]
Repository = "https://github.com/mariolpantunes/ml-meta-perf"
Issues = "https://github.com/mariolpantunes/ml-meta-perf/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The corpus ships with the package: `pip install metafit && metafit` has no repository
# around it to find a top-level data/ directory in.
metafit = ["meta_dataset.csv"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
typeCheckingMode = "standard"
venvPath = "."
venv = "venv"
include = ["src/metafit", "tests"]
reportImportCycles = "none"

[tool.vulture]
paths = ["src/metafit", "tests"]
min_confidence = 80

[tool.coverage.run]
source = ["src/metafit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
