name: Generate and Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdoc==16.0.0
          pip install .

      - name: Generate Docs
        run: |
          # pdoc documents the package page but does not reliably discover every
          # implementation module. Generate the public package page separately, then
          # enumerate the modules so a pdoc upgrade cannot silently drop API pages.
          MODULES="$(python - <<'PY'
          import pkgutil
          import ml_meta_perf

          print(" ".join(sorted(
              module.name
              for module in pkgutil.walk_packages(
                  ml_meta_perf.__path__, ml_meta_perf.__name__ + "."
              )
          )))
          PY
          )"
          pdoc --math -d google -o docs_package ml_meta_perf \
            --logo "assets/logo.svg" \
            --favicon "assets/logo.svg"
          pdoc --math -d google -o docs_build ${MODULES} \
            --logo "assets/logo.svg" \
            --favicon "assets/logo.svg"
          cp docs_package/ml_meta_perf.html docs_build/ml_meta_perf.html
          # The logo path is resolved relative to the page referencing it, and
          # pdoc emits two levels: `ml_meta_perf.html` at the root and
          # `ml_meta_perf/<submodule>.html` below it. A single copy leaves every
          # submodule page with a broken logo, so the assets go in both. The
          # assets tree also carries the study chapters each module docstring
          # links to, and the figures those chapters embed.
          cp -r assets docs_build/assets
          cp -r assets docs_build/ml_meta_perf/assets
          touch docs_build/.nojekyll

      - name: Validate generated API pages and logos
        run: |
          python - <<'PY'
          import pathlib, pkgutil, re, sys

          import ml_meta_perf

          root = pathlib.Path("docs_build")
          pages = list(root.rglob("*.html"))
          expected = {root / "ml_meta_perf.html"}
          expected.update(
              root / pathlib.Path(*module.name.split(".")).with_suffix(".html")
              for module in pkgutil.walk_packages(
                  ml_meta_perf.__path__, ml_meta_perf.__name__ + "."
              )
          )
          absent = sorted(str(path.relative_to(root)) for path in expected if not path.exists())
          if absent:
              print("::error::API pages that were not generated:")
              print("\n".join(absent))
              sys.exit(1)
          missing = [f"{p.relative_to(root)} -> {r}" for p in pages
                     for r in set(re.findall(r'(?:src|href)="([^"]*logo\.svg)"',
                                             p.read_text()))
                     if not (p.parent / r).exists()]
          if missing:
              print("::error::logo references that do not resolve:")
              print("\n".join(missing))
              sys.exit(1)
          print(f"checked {len(pages)} pages, all logo references resolve")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs_build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
