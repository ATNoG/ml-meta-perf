name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Both versions always run. Fail-fast cancels 3.12 the moment 3.14 fails,
      # which hid whether 3.12 was healthy behind a 3.14-only import error.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # `pyproject.toml` is the only dependency manifest. The `dev` extra pins the three
          # static-analysis tools: unpinned, a linter release that enables new rules by default
          # fails a PR that changed none of the code it flags -- which happened at ruff 0.16.
          # The exact reference runtime is exercised on its recorded Python version, the
          # declared compatible ranges on the newest supported one.
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            pip install ".[dev,reproducibility]"
          else
            pip install ".[dev]"
          fi

      - name: Lint with Ruff
        run: ruff check src tests

      - name: Check formatting with Ruff
        # Check only: the gate never rewrites files. Fix with `ruff format src tests`.
        run: ruff format --check src tests

      - name: Type-check with basedpyright
        # --pythonpath, because pyproject.toml deliberately pins no venv: without it
        # basedpyright resolves no third-party import and exits 3 on a clean runner.
        run: basedpyright --pythonpath "$(which python)"

      - name: Dead code with Vulture
        run: vulture

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: The MCC experiment reproduces end to end
        # The tests cover the parts; this covers the whole, which is what a reader cloning the
        # repository actually runs. It also fails loudly if the shipped meta-dataset and the code
        # disagree about the schema. The result folder goes to the runner's temporary directory,
        # and `tests/regression.py` compares it with the results of the start of the work.
        run: |
          ml-meta-perf fit --config config/mcc.json --quiet --output "${RUNNER_TEMP}/results"
          python -m tests.regression "${RUNNER_TEMP}/results/meta_dataset/MCC"
