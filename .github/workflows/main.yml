name: Python CI

# The same gate as ess, knee, pyBlindOpt and torann, so a change that passes
# locally in one repository passes in all of them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Both versions always run. Fail-fast cancels 3.12 the moment 3.14 fails,
      # which hid whether 3.12 was healthy behind a 3.14-only import error.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned, and matching the other repositories. Unpinned, a linter
          # release that enables new rules by default fails a PR that changed
          # none of the code it flags -- which is what happened at ruff 0.16.
          pip install ruff==0.16.1 basedpyright==1.39.8 vulture==2.16
          # No extras: there are none. joblib is a base dependency because `opaque` runs on
          # it, so a plain install type-checks and runs the whole study.
          pip install .

      - name: Lint with Ruff
        run: ruff check src tests

      - name: Type-check with basedpyright
        # --pythonpath, because pyproject.toml deliberately pins no venv: without it
        # basedpyright resolves no third-party import and exits 3 on a clean runner.
        run: basedpyright --pythonpath "$(which python)"

      - name: Dead code with Vulture
        run: vulture

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: The study reproduces end to end
        # The tests cover the parts; this covers the whole, which is what a
        # reader cloning the repository actually runs. It also fails loudly if
        # the shipped meta-dataset and the code disagree about the schema.
        #
        # There is no `--report` flag and there never was: this step passed one and
        # exited 2 on argparse, every time, unnoticed because nothing has ever run
        # on a runner. The generated chapter sections are written by default, into
        # the checked-out `assets/docs`, which is what a reader gets and is
        # disposable here -- `--output` and `--figures` are redirected only so the
        # run does not overwrite the tracked results and figures.
        run: python -m ml_meta_perf --quiet --output "${RUNNER_TEMP}/results"
          --figures "${RUNNER_TEMP}/figures"
