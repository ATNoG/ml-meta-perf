# The commit gate mirrors the four checks in `.github/workflows/main.yml`.
#
# The local hooks use one pre-commit-managed Python environment rather than repository-local
# `venv/bin/...` paths. That makes the installed Git hook portable across Linux and Windows.
# Each hook receives the same pinned tools (the `dev` extra in `pyproject.toml`) and runtime
# dependencies, and reads the working tree's `src/` rather than an installed copy: basedpyright
# through `extraPaths` in `pyproject.toml`, the tests by putting `src` first on `sys.path`.
#
# `pass_filenames: false` is deliberate. Ruff, BasedPyright, and Vulture need the complete
# configured source tree, and the unit-test command always runs the full suite.
#
# Install with: pre-commit install
# Run over everything once: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check src tests
        language: python
        additional_dependencies: &gate_dependencies
          - ruff==0.16.9
          - basedpyright==1.40.1
          - vulture==2.16
          - numpy==2.5.3
          - polars==1.44.2
          - matplotlib==3.11.2
          - scikit-learn==1.9.1
          - joblib==1.6.0
          - jsonargparse==4.52.0
          - kneeliverse==1.2.0
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: basedpyright
        name: basedpyright
        entry: basedpyright
        language: python
        additional_dependencies: *gate_dependencies
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: vulture
        name: vulture
        entry: vulture
        language: python
        additional_dependencies: *gate_dependencies
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: unittest
        name: unittest
        entry: python -c "import sys, unittest; sys.path.insert(0, 'src'); unittest.main(module=None, argv=['unittest', 'discover', '-s', 'tests'])"
        language: python
        additional_dependencies: *gate_dependencies
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false
