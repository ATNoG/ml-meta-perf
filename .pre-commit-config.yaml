# The commit gate mirrors the four checks in `.github/workflows/main.yml`.
#
# The local hooks use one pre-commit-managed Python environment rather than repository-local
# `venv/bin/...` paths. That makes the installed Git hook portable across Linux and Windows.
# Each hook receives the same pinned tools and runtime dependencies; the launcher adds the
# working tree's `src/` directory so tests exercise current code rather than an installed copy.
#
# `pass_filenames: false` is deliberate. Ruff, BasedPyright, and Vulture need the complete
# configured source tree, and the unit-test command always runs the full suite.
#
# Install with: pre-commit install
# Run over everything once: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: python scripts/precommit_gate.py ruff
        language: python
        additional_dependencies: &gate_dependencies
          - ruff==0.16.1
          - basedpyright==1.39.8
          - vulture==2.16
          - numpy==2.5.3
          - polars==1.44.1
          - matplotlib==3.11.1
          - scikit-learn==1.9.0
          - joblib==1.6.0
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: basedpyright
        name: basedpyright
        entry: python scripts/precommit_gate.py basedpyright
        language: python
        additional_dependencies: *gate_dependencies
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: vulture
        name: vulture
        entry: python scripts/precommit_gate.py vulture
        language: python
        additional_dependencies: *gate_dependencies
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: unittest
        name: unittest
        entry: python scripts/precommit_gate.py unittest
        language: python
        additional_dependencies: *gate_dependencies
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false
