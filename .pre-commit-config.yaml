# The CI pipeline, moved to commit time.
#
# Every project hook below is `language: system` rather than a pinned mirror. A mirror
# fetches its own copy of ruff or basedpyright and runs it against a config pre-commit
# chose, which is how a repository ends up with hooks that pass and CI that fails.
# These call the tools installed in `venv/` and let them read `pyproject.toml`, so
# `git commit` and `ci.sh` run the same check with the same settings by construction.
#
# `pass_filenames: false` throughout is deliberate. basedpyright and vulture both need
# the whole project to be correct -- vulture calls a function dead when nothing
# references it, so handing it only the staged files makes everything they reference
# look unreferenced. Type checking one file in isolation fails the same way.
#
# `files` rather than `types: [python]` on the project-wide hooks: they are
# driven by pyproject.toml (ruff rules, basedpyright mode, vulture paths, any
# coverage threshold), so a commit that changes only that file must still run
# them. Filtering on file *type* skipped them all at exactly the moment the
# configuration governing them was being edited.
#
# Install with: venv/bin/pre-commit install
# Run over everything once: venv/bin/pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      - id: tests
        name: unittest + coverage
        # The tests run once, under coverage, rather than once bare and once again for
        # the report -- the suite takes ~25s and a commit hook should not pay that twice.
        # PYTHONPATH=src, not a bare `python`: a commit hook has no install step and the
        # interpreter on PATH is whoever's. Testing the working tree is also the more
        # useful thing to check before a commit.
        entry: bash -c 'PYTHONPATH=src venv/bin/coverage run -m unittest discover -s tests && venv/bin/coverage report'
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: ruff
        name: ruff
        entry: venv/bin/ruff check .
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: basedpyright
        name: basedpyright
        entry: venv/bin/basedpyright
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: vulture
        name: vulture
        entry: venv/bin/vulture
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false
