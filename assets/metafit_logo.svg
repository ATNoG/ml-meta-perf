<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="metafit logo">
  <title>metafit</title>
  <defs>
    <linearGradient id="mf-grid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="mf-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="124" height="124" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <!-- The meta-dataset: a grid of (dataset, model) cells, a few of them measured. -->
  <g fill="url(#mf-grid)">
    <rect x="18" y="20" width="12" height="12" rx="3" opacity="0.95"/>
    <rect x="34" y="20" width="12" height="12" rx="3" opacity="0.55"/>
    <rect x="50" y="20" width="12" height="12" rx="3" opacity="0.80"/>
    <rect x="66" y="20" width="12" height="12" rx="3" opacity="0.30"/>

    <rect x="18" y="36" width="12" height="12" rx="3" opacity="0.45"/>
    <rect x="34" y="36" width="12" height="12" rx="3" opacity="0.90"/>
    <rect x="50" y="36" width="12" height="12" rx="3" opacity="0.35"/>
    <rect x="66" y="36" width="12" height="12" rx="3" opacity="0.70"/>

    <rect x="18" y="52" width="12" height="12" rx="3" opacity="0.75"/>
    <rect x="34" y="52" width="12" height="12" rx="3" opacity="0.25"/>
    <rect x="50" y="52" width="12" height="12" rx="3" opacity="0.95"/>
    <rect x="66" y="52" width="12" height="12" rx="3" opacity="0.50"/>
  </g>

  <!-- The reduction: many cells collapse into one short additive expression. -->
  <path d="M88 42 L100 42" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M96 37 L102 42 L96 47" fill="none" stroke="#94a3b8" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- MCC = w1 t1 + w2 t2 + ... rendered as weighted bars of decreasing length. -->
  <g stroke="url(#mf-line)" stroke-width="6" stroke-linecap="round">
    <path d="M22 84 L92 84"/>
    <path d="M22 98 L74 98"/>
    <path d="M22 112 L52 112"/>
  </g>
  <g fill="#1e3a8a">
    <circle cx="100" cy="84" r="3.5"/>
    <circle cx="82" cy="98" r="3.5"/>
    <circle cx="60" cy="112" r="3.5"/>
  </g>
</svg>
