<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="img" aria-label="metafit — sparse interpretable equations for classifier performance">
  <title>metafit — sparse interpretable equations for classifier performance</title>
  <desc>A fitted line rising from lower left to upper right, with four bold
  markers scattered either side of it and short residual ticks joining each one
  to the line. The faint markers further off are the candidate terms the search
  considered and did not select. The line is the equation: a weighted sum of a
  few simple terms, fitted by least squares.</desc>

  <!-- Light and dark are both first-class: this renders on GitHub in either
       theme and on pdoc pages, which follow the reader's preference. -->
  <style>
    .cell     { fill: #f8fafc; stroke: #cbd5e1; }
    .fit      { stroke: #64748b; }
    .residual { stroke: #94a3b8; }
    .dropped  { fill: #cbd5e1; }
    .halo     { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .cell     { fill: #0f172a; stroke: #334155; }
      .fit      { stroke: #94a3b8; }
      .residual { stroke: #475569; }
      .dropped  { fill: #334155; }
      .halo     { stroke: #0f172a; }
    }
  </style>

  <rect class="cell" x="4" y="4" width="120" height="120" rx="24" stroke-width="4"/>

  <!-- the fitted line: the equation itself -->
  <line class="fit" x1="24" y1="100" x2="104" y2="30" stroke-width="4" stroke-linecap="round"/>

  <!-- candidate terms the search rejected, off the line -->
  <g class="dropped">
    <circle cx="40" cy="46" r="4"/>
    <circle cx="92" cy="90" r="4"/>
    <circle cx="34" cy="72" r="4"/>
    <circle cx="102" cy="66" r="4"/>
  </g>

  <!-- residuals: each selected term joined to the line it helps define -->
  <g class="residual" stroke-width="2.5" stroke-linecap="round">
    <line x1="42" y1="76" x2="42" y2="84.2"/>
    <line x1="62" y1="73" x2="62" y2="66.8"/>
    <line x1="80" y1="43" x2="80" y2="51"/>
    <line x1="96" y1="43" x2="96" y2="37"/>
  </g>

  <!-- the selected terms -->
  <g class="halo" stroke-width="2.5">
    <circle cx="42" cy="76" r="7" fill="#3b82f6"/>
    <circle cx="62" cy="73" r="7" fill="#8b5cf6"/>
    <circle cx="80" cy="43" r="7" fill="#06b6d4"/>
    <circle cx="96" cy="43" r="7" fill="#14b8a6"/>
  </g>
</svg>
